name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package and publish
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Build Signal
        shell: bash
        run: cargo build --release --locked --package signal-cli --bin signal --target "$TARGET"

      - name: Verify static musl binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -eu
          binary="target/${TARGET}/release/signal"
          file "$binary"
          file "$binary" | grep -Eq 'static(-pie)? linked|statically linked'
          ! readelf -d "$binary" 2>&1 | grep -q "NEEDED"
          ! strings "$binary" | grep -q "GLIBC_"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          mkdir staging
          cp "target/${TARGET}/release/signal" staging/signal
          cp LICENSE README.md staging/
          archive="signal-${RELEASE_TAG}-${TARGET}.tar.gz"
          tar -czf "$archive" -C staging .
          tar -tzf "$archive" | grep -Fx './signal' >/dev/null

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory staging | Out-Null
          Copy-Item "target/$env:TARGET/release/signal.exe" staging/signal.exe
          Copy-Item LICENSE,README.md staging/
          Compress-Archive -Path staging/* -DestinationPath "signal-${env:RELEASE_TAG}-${env:TARGET}.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: signal-${{ matrix.target }}
          path: signal-${{ inputs.release_tag || github.ref_name }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: signal-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Signal ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
