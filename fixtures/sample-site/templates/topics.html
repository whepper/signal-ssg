<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{{ title }} · {{ site_title }}</title>
  {% if base_url %}<link rel="alternate" type="application/rss+xml" title="{{ site_title }} RSS" href="{{ base_url }}/index.xml" />{% endif %}
  {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}" />{% endif %}
  <meta property="og:title" content="{{ og_title }}" />
  {% if og_url %}<meta property="og:url" content="{{ og_url }}" />{% endif %}
  <meta property="og:type" content="{{ og_type }}" />
  <script type="application/ld+json">{{ json_ld | safe }}</script>
</head>
<body>
  {% if menus %}
  <nav class="main-nav" aria-label="Main">
    <ul>
      {% for item in menus.main %}
      <li{% if item.active %} class="active"{% endif %}><a href="{{ item.url }}">{{ item.label }}</a></li>
      {% endfor %}
    </ul>
  </nav>
  {% endif %}
  <h1>{{ title }}</h1>
  <ul>
    {% for t in topics %}<li><a href="{{ t.route }}">{{ t.label }}</a> ({{ t.count }})</li>{% endfor %}
  </ul>
</body>
</html>
