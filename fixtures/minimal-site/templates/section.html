<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
    {% if description %}<meta name="description" content="{{ description }}" />{% endif %}
  </head>
  <body>
    <h1>{{ title }}</h1>
    {% if content %}{{ content | safe }}{% endif %}
    <ul>
      {% for e in entries %}<li><a href="{{ e.route }}">{{ e.title }}</a></li>{% endfor %}
    </ul>
  </body>
</html>
