[package]
name = "signal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI, configuration loading, and build orchestration for Signal SSG"

[[bin]]
name = "signal"
path = "src/main.rs"

[lib]
name = "signal_cli"
path = "src/lib.rs"

[dependencies]
signal-core = { workspace = true }
signal-generators = { workspace = true }
signal-markdown = { workspace = true }
signal-render = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
ab_glyph = { workspace = true }
ravif = { workspace = true }
rgb = { workspace = true }
imgref = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tiny_http = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
tempfile = "3.10"
quick-xml = { workspace = true }
