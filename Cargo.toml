[workspace]
members = [
    "crates/signal-core",
    "crates/signal-markdown",
    "crates/signal-render",
    "crates/signal-generators",
    "crates/signal-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/whepper/signal-ssg"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
quick-xml = "0.42"
sha2 = "0.10"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
miette = { version = "7.0", features = ["fancy"] }
minijinja = { version = "2.0", features = ["urlencode"] }
comrak = "0.24"
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
ravif = { version = "0.13", default-features = false }
rgb = "0.8"
imgref = "1.10"
simple-minify-html = "0.17"
tiny_http = "0.12"
notify = "6"
signal-core = { path = "crates/signal-core", version = "1.0.0" }
signal-markdown = { path = "crates/signal-markdown", version = "1.0.0" }
signal-render = { path = "crates/signal-render", version = "1.0.0" }
signal-generators = { path = "crates/signal-generators", version = "1.0.0" }
