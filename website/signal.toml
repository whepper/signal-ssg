[site]
title = "Signal"
base_url = "https://whepper.github.io/signal-ssg/"
home_collection = "posts"
author = "Signal contributors"
date_format = "%-d %B %Y"

[taxonomy]
route_prefix = "/topics/"
title = "Topics"

[feed]
limit = 20

[menus.main]
items = [
  { label = "Home", url = "https://whepper.github.io/signal-ssg/" },
  { label = "Docs", url = "https://whepper.github.io/signal-ssg/docs/getting-started/" },
  { label = "Features", url = "https://whepper.github.io/signal-ssg/docs/features/" },
  { label = "GitHub", url = "https://github.com/whepper/signal-ssg" },
]

[collections.posts]
source = "content/posts"
route_prefix = "/posts/"
template = "post.html"
title = "Posts"
description = "Notes from the Signal project."

[collections.docs]
source = "content/docs"
route_prefix = "/docs/"
template = "doc.html"
title = "Documentation"
description = "Guides and reference documentation for Signal."
